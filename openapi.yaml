  /delay/{ms}:
    get:
      tags: [HTTP Testing Utilities]
      summary: Waits {ms} milliseconds before responding, bounded by MAX_DELAY_MS
      operationId: getDelayByPath
      security: []
      parameters:
        - name: ms
          in: path
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Delayed response
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DelayResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /delay:
    get:
      tags: [HTTP Testing Utilities]
      summary: Waits ?ms= milliseconds before responding, bounded by MAX_DELAY_MS
      operationId: getDelayByQuery
      security: []
      parameters:
        - name: ms
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Delayed response
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DelayResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /payload/{preset}:
    get:
      tags: [HTTP Testing Utilities]
      summary: Returns a generated response body sized to a named preset (small=1KB, medium=100KB, large=1MB)
      operationId: getPayloadByPreset
      security: []
      parameters:
        - name: preset
          in: path
          required: true
          schema: { $ref: "#/components/schemas/PayloadSizePreset" }
      responses:
        "200":
          description: Generated payload
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeneratedPayload" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /payload:
    get:
      tags: [HTTP Testing Utilities]
      summary: Returns a generated response body of ?size= bytes, bounded by MAX_PAYLOAD_SIZE
      operationId: getPayloadBySize
      security: []
      parameters:
        - name: size
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Generated payload
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeneratedPayload" }
        "400": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [HTTP Testing Utilities]
      summary: Echoes the exact byte length of the posted request body, bounded by MAX_PAYLOAD_SIZE
      operationId: postPayload
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema: {}
      responses:
        "200":
          description: Received
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayloadEchoResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }

  /content/{type}:
    get:
      tags: [HTTP Testing Utilities]
      summary: Returns a response in the requested content type (json, text, html, or xml)
      operationId: getContentDemo
      security: []
      parameters:
        - name: type
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ContentType" }
      responses:
        "200":
          description: Content-type demo
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json: { schema: {} }
            text/plain: { schema: { type: string } }
            text/html: { schema: { type: string } }
            application/xml: { schema: { type: string } }
        "400": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [HTTP Testing Utilities]
      summary: Validates the request's Content-Type header matches {type}'s expected media type
      operationId: postContentDemo
      security: []
      parameters:
        - name: type
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ContentType" }
      responses:
        "200":
          description: Content-Type matched
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentAcceptedResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /headers:
    get:
      tags: [HTTP Testing Utilities]
      summary: Echoes every incoming request header except Authorization, Cookie, and X-API-Key
      operationId: getHeaders
      security: []
      responses:
        "200":
          description: Safe headers
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HeadersResponse" }

  /cookies:
    get:
      tags: [HTTP Testing Utilities]
      summary: Reports every cookie present on the request
      operationId: getCookies
      security: []
      responses:
        "200":
          description: Current cookies
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CookieMapResponse" }
    post:
      tags: [HTTP Testing Utilities]
      summary: Sets an arbitrary named cookie without disturbing any other cookie held
      operationId: postCookies
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CookieSetRequest" }
      responses:
        "200":
          description: Cookie set
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CookieSetResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [HTTP Testing Utilities]
      summary: Clears one named cookie via ?name=, leaving every other cookie intact
      operationId: deleteCookies
      security: []
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Cookie cleared (idempotent, even if it was never set)
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CookieClearResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /rate-limit:
    get:
      tags: [Resilience Simulation]
      summary: Per-caller rate-limit demo; 429 + Retry-After once the configured threshold is exceeded
      operationId: getRateLimit
      security: []
      responses:
        "200":
          description: Under the threshold
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RateLimitStatus" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /flaky:
    get:
      tags: [Resilience Simulation]
      summary: Simulates a flaky dependency; fails at approximately the requested rate with a reproducible, seeded outcome
      operationId: getFlaky
      security: []
      parameters:
        - name: failureRate
          in: query
          required: false
          description: Decimal in [0, 1]; defaults to the configured FAILURE_RATE when omitted
          schema: { type: number, minimum: 0, maximum: 1 }
      responses:
        "200":
          description: Simulated success
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlakyResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "500":
          description: Simulated failure (server error)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Simulated failure (bad gateway)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Simulated failure (service unavailable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "504":
          description: Simulated failure (gateway timeout)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /cache/resource:
    get:
      tags: [Resilience Simulation]
      summary: Returns a cacheable demo resource with ETag/Last-Modified, honoring conditional headers
      operationId: getCacheResource
      security: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
        - name: If-Modified-Since
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Full resource (no matching conditional header)
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
            ETag: { schema: { type: string } }
            Last-Modified: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheResource" }
        "304":
          description: Not modified — conditional header matched the current validator
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
            ETag: { schema: { type: string } }
    put:
      tags: [Resilience Simulation]
      summary: Updates the cache-demo resource's content, reissuing ETag/Last-Modified
      operationId: putCacheResource
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CacheResourceUpdateRequest" }
      responses:
        "200":
          description: Updated resource, with new validators
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
            ETag: { schema: { type: string } }
            Last-Modified: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CacheResource" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /files:
    get:
      tags: [Files]
      summary: Lists every currently stored file's metadata, newest first
      operationId: listFiles
      security: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Paginated list of stored files' metadata (never raw content)
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileMetadata"
                  pagination:
                    $ref: "#/components/schemas/PaginationMeta"
        "400": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [Files]
      summary: Uploads one file via multipart/form-data under the 'upload' field
      operationId: uploadFile
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [upload]
              properties:
                upload:
                  type: string
                  format: binary
      responses:
        "201":
          description: File stored
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileMetadata" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "409": { $ref: "#/components/responses/StorageLimitExceeded" }

  /files/{id}:
    parameters:
      - $ref: "#/components/parameters/FileIdParam"
    get:
      tags: [Files]
      summary: Downloads a stored file's exact original bytes
      operationId: getFileById
      security: []
      responses:
        "200":
          description: Raw file content
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
            Content-Disposition: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Files]
      summary: Deletes a stored file
      operationId: deleteFileById
      security: []
      responses:
        "204":
          description: File deleted
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/NotFound" }

  /errors/validation:
    get:
      tags: [Error Simulation]
      summary: Deterministic 400 Bad Request demo
      operationId: getErrorsValidation
      security: []
      responses:
        "400": { $ref: "#/components/responses/ValidationError" }

  /errors/not-found:
    get:
      tags: [Error Simulation]
      summary: Deterministic 404 Not Found demo
      operationId: getErrorsNotFound
      security: []
      responses:
        "404": { $ref: "#/components/responses/NotFound" }

  /errors/conflict:
    get:
      tags: [Error Simulation]
      summary: Deterministic 409 Conflict demo
      operationId: getErrorsConflict
      security: []
      responses:
        "409": { $ref: "#/components/responses/Conflict" }

  /errors/unauthorized:
    get:
      tags: [Error Simulation]
      summary: Deterministic 401 Unauthorized demo (ignores any credentials supplied)
      operationId: getErrorsUnauthorized
      security: []
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }

  /errors/forbidden:
    get:
      tags: [Error Simulation]
      summary: Deterministic 403 Forbidden demo (ignores any credentials supplied)
      operationId: getErrorsForbidden
      security: []
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }

  /errors/rate-limit:
    get:
      tags: [Error Simulation]
      summary: Deterministic 429 Too Many Requests demo (does not touch the real /rate-limit counters)
      operationId: getErrorsRateLimit
      security: []
      responses:
        "429": { $ref: "#/components/responses/RateLimited" }

  /errors/server-error:
    get:
      tags: [Error Simulation]
      summary: Deterministic 500 Internal Server Error demo
      operationId: getErrorsServerError
      security: []
      responses:
        "500": { $ref: "#/components/responses/ServerError" }

  /errors/service-unavailable:
    get:
      tags: [Error Simulation]
      summary: Deterministic 503 Service Unavailable demo
      operationId: getErrorsServiceUnavailable
      security: []
      responses:
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /errors/timeout:
    get:
      tags: [Error Simulation]
      summary: Deterministic 408 Request Timeout demo (responds immediately; does not hold the connection open)
      operationId: getErrorsTimeout
      security: []
      responses:
        "408": { $ref: "#/components/responses/RequestTimeout" }

  /admin/reset:
    post:
      tags: [Admin]
      summary: Restore every CRUD/read-oriented resource, the rate limiter, the idempotency store, the cache-demo resource, and uploaded files to their seeded state
      operationId: postAdminReset
      security:
        - adminTokenAuth: []
      responses:
        "200":
          description: Data-plane state has been restored to its seeded configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminResetResult" }
        "401":
          description: Missing or empty X-Admin-Token header
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: X-Admin-Token header present but does not match the configured admin token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/auth/reset:
    post:
      tags: [Admin]
      summary: Restore issued JWT session/refresh-token records and issued/revoked API keys to their initial state
      operationId: postAdminAuthReset
      security:
        - adminTokenAuth: []
      responses:
        "200":
          description: Auth-plane state has been restored to its initial configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminResetResult" }
        "401":
          description: Missing or empty X-Admin-Token header
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: X-Admin-Token header present but does not match the configured admin token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    basicAuth:
      type: http
      scheme: basic
    adminTokenAuth:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: >
        Shared admin secret (configured via the ADMIN_TOKEN environment variable) required to call
        any /admin/* endpoint. Missing or empty → 401. Present but not matching → 403.

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SortParam:
      name: sort
      in: query
      required: false
      description: Field name for ascending order, or `-field` for descending.
      schema:
        type: string
    UserIdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
    ProductIdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
    CustomerIdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
    OrderIdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer

    CategorySlugParam:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    PostIdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommentIdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
    ReviewIdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
    PaymentIdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileIdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DateParam:
      name: date
      in: path
      required: true
      schema:
        type: string
        format: date
    RatingParam:
      name: rating
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 5
    StatusCodeParam:
      name: code
      in: path
      required: true
      description: >
        Must be a strict positive integer with no leading zero and no surrounding whitespace, in the
        range 100-599, and one of the 24 documented codes — anything else returns 400.
      schema:
        type: integer
        minimum: 100
        maximum: 599

  schemas:
    AuthRequirement:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [none, jwt, apiKey, basic, adminToken]
        detail:
          type: string
          description: >
            Present only when a route requires more than a successfully authenticated caller
            under the given type — e.g. "role: admin", "scope: orders:write", or a note that the
            requirement is determined by a path parameter.
          example: "role: admin"

    RouteInfo:
      type: object
      required: [method, path, description, auth]
      properties:
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE]
        path:
          type: string
          example: "/api/v1/users/{id}"
        description:
          type: string
          example: "Get, replace, partially update, or delete a single user by id"
        auth:
          $ref: "#/components/schemas/AuthRequirement"

    RoutesListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RouteInfo"

    UserRole:
      type: string
      enum: [user, admin, manager, readonly]

    UserStatus:
      type: string
      enum: [active, inactive]

    ProductCategory:
      type: string
      enum: [electronics, books, clothing, home, toys, grocery, sports, beauty, automotive, other]

    OrderStatus:
      type: string
      enum: [pending, processing, shipped, delivered, cancelled]

    User:
      type: object
      required: [id, name, email, role, status, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/UserRole" }
        status: { $ref: "#/components/schemas/UserStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UserCreate:
      type: object
      required: [name, email, role]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/UserRole" }
        status: { $ref: "#/components/schemas/UserStatus" }

    UserPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/UserRole" }
        status: { $ref: "#/components/schemas/UserStatus" }

    Product:
      type: object
      required: [id, name, description, price, category, stock, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        price: { type: number, exclusiveMinimum: 0 }
        category: { $ref: "#/components/schemas/ProductCategory" }
        stock: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProductCreate:
      type: object
      required: [name, price, category, stock]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        price: { type: number, exclusiveMinimum: 0 }
        category: { $ref: "#/components/schemas/ProductCategory" }
        stock: { type: integer, minimum: 0 }

    ProductPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        price: { type: number, exclusiveMinimum: 0 }
        category: { $ref: "#/components/schemas/ProductCategory" }
        stock: { type: integer, minimum: 0 }

    Address:
      type: object
      required: [street, city, postalCode, country]
      additionalProperties: false
      properties:
        street: { type: string }
        city: { type: string }
        postalCode: { type: string }
        country: { type: string }

    Customer:
      type: object
      required: [id, name, email, address, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        address: { $ref: "#/components/schemas/Address" }
        userId: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CustomerCreate:
      type: object
      required: [name, email, address]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email }
        address: { $ref: "#/components/schemas/Address" }
        userId: { type: integer, nullable: true }

    CustomerPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email }
        address: { $ref: "#/components/schemas/Address" }
        userId: { type: integer, nullable: true }

    OrderLineItem:
      type: object
      required: [productId, quantity]
      additionalProperties: false
      properties:
        productId: { type: integer }
        quantity: { type: integer, minimum: 1 }

    Order:
      type: object
      required: [id, customerId, items, status, total, createdAt, updatedAt]
      properties:
        id: { type: integer }
        customerId: { type: integer }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/OrderLineItem" }
        status: { $ref: "#/components/schemas/OrderStatus" }
        total: { type: number, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    OrderCreate:
      type: object
      required: [customerId, items]
      additionalProperties: false
      properties:
        customerId: { type: integer }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/OrderLineItem" }
        status: { $ref: "#/components/schemas/OrderStatus" }

    OrderPatch:
      type: object
      additionalProperties: false
      properties:
        customerId: { type: integer }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/OrderLineItem" }
        status: { $ref: "#/components/schemas/OrderStatus" }

    HealthStatus:
      type: object
      required: [status, uptimeSeconds, timestamp]
      properties:
        status:
          type: string
          enum: [ok, not-ready]
        uptimeSeconds:
          type: number
        timestamp:
          type: string
          format: date-time

    VersionInfo:
      type: object
      required: [version, nodeEnv]
      properties:
        version:
          type: string
        nodeEnv:
          type: string

    ApiInfo:
      type: object
      required: [name, version, environment, apiPrefix, uptimeSeconds]
      properties:
        name:
          type: string
        version:
          type: string
        environment:
          type: string
        apiPrefix:
          type: string
        uptimeSeconds:
          type: number

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, requestId]
          properties:
            code:
              type: string
              example: RESOURCE_NOT_FOUND
            message:
              type: string
            details:
              type: object
            requestId:
              type: string
              format: uuid

    PaginationMeta:
      type: object
      required: [page, limit, total, totalPages, hasNext, hasPrevious]
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean

    PaymentStatus:
      type: string
      enum: [pending, completed, failed, refunded]

    SearchResourceType:
      type: string
      enum: [user, customer, product, category, post, comment, review]

    Category:
      type: object
      required: [id, name, description, createdAt]
      properties:
        id: { type: string, description: URL-safe slug identifier }
        name: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }

    Post:
      type: object
      required: [id, userId, title, body, publishedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: integer }
        title: { type: string }
        body: { type: string }
        publishedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PostCreate:
      type: object
      required: [title, body]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 5000 }

    Comment:
      type: object
      required: [id, postId, userId, body, createdAt]
      properties:
        id: { type: integer }
        postId: { type: string, format: uuid }
        userId: { type: integer }
        body: { type: string }
        createdAt: { type: string, format: date-time }

    CommentCreate:
      type: object
      required: [userId, body]
      additionalProperties: false
      properties:
        userId: { type: integer }
        body: { type: string, minLength: 1, maxLength: 1000 }

    Review:
      type: object
      required: [id, productId, userId, rating, body, createdAt]
      properties:
        id: { type: integer }
        productId: { type: integer }
        userId: { type: integer }
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string }
        createdAt: { type: string, format: date-time }

    Payment:
      type: object
      required: [id, orderId, amount, status, processedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: integer }
        amount: { type: number, minimum: 0 }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        processedAt: { type: string, format: date }
        createdAt: { type: string, format: date-time }

    RateLimitStatus:
      type: object
      required: [remaining, limit]
      properties:
        remaining: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }

    FlakyResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    CreatePaymentRequest:
      type: object
      required: [orderId, amount, status]
      additionalProperties: false
      properties:
        orderId: { type: integer }
        amount: { type: number, minimum: 0 }
        status: { $ref: "#/components/schemas/PaymentStatus" }

    CacheResource:
      type: object
      required: [content, version, updatedAt]
      properties:
        content: {}
        version: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }

    CacheResourceUpdateRequest:
      type: object
      required: [content]
      additionalProperties: false
      properties:
        content: {}

    SearchResult:
      type: object
      required: [resourceType, id, label]
      properties:
        resourceType: { $ref: "#/components/schemas/SearchResourceType" }
        id: { type: string }
        label: { type: string }
        snippet: { type: string }

    StatusDemoSuccess:
      type: object
      required: [status, name, message]
      properties:
        status: { type: integer, example: 200 }
        name: { type: string, example: "OK" }
        message: { type: string }

    StatusDemoRedirect:
      type: object
      required: [status, name, message, location]
      properties:
        status: { type: integer, example: 301 }
        name: { type: string, example: "Moved Permanently" }
        message: { type: string }
        location: { type: string, example: "/api/v1/status/200" }

    TestScenarioResult:
      type: object
      description: >
        All fields are optional and vary by how the 200 was reached — see the /api/v1/test 200
        response description for the exact per-case field set.
      properties:
        scenario:
          type: string
          example: success
        status:
          type: integer
          example: 200
        name:
          type: string
          description: Present only for scenario=success (or absent), matching GET /api/v1/status/{code}'s own body
        message:
          type: string
        delayMs:
          type: integer
          description: Present only when scenario=delayed
        size:
          type: integer
          description: Present only when scenario=large-response
        data:
          type: string
          description: Present only when scenario=large-response

    AdminResetResult:
      type: object
      required: [message, domain, requestId]
      properties:
        message:
          type: string
          example: Data reset to seed state
        domain:
          type: string
          enum: [data, auth]
        requestId:
          type: string

    Role:
      type: string
      enum: [user, admin, manager, readonly]

    Scope:
      type: string
      enum:
        [
          "users:read",
          "users:write",
          "products:read",
          "products:write",
          "orders:read",
          "orders:write",
          "admin",
        ]

    TokenKind:
      type: string
      enum: [valid, expired, invalid, revoked]

    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }

    TokenPairResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, example: "Bearer" }
        expiresIn: { type: integer, description: "Access token lifetime in seconds" }

    RefreshRequest:
      type: object
      required: [refreshToken]
      additionalProperties: false
      properties:
        refreshToken: { type: string, minLength: 1 }

    MeResponse:
      type: object
      required: [sub, role, scopes]
      properties:
        sub: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/Scope" }

    TokenIssueRequest:
      type: object
      required: [role, scopes, kind]
      additionalProperties: false
      properties:
        role: { $ref: "#/components/schemas/Role" }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/Scope" }
        kind: { $ref: "#/components/schemas/TokenKind" }

    TokenIssueResponse:
      type: object
      required: [accessToken, tokenType, kind]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: "Bearer" }
        kind: { $ref: "#/components/schemas/TokenKind" }

    TokenInfoResponse:
      type: object
      required: [state, claims]
      properties:
        state:
          type: string
          enum:
            [
              valid,
              expired,
              invalid-signature,
              wrong-issuer,
              wrong-audience,
              wrong-token-type,
              revoked,
            ]
        claims:
          type: object
          description: The token's decoded payload (present even when state is not "valid")
          additionalProperties: true

    ProtectedResponse:
      type: object
      required: [granted, role]
      properties:
        granted: { type: boolean, example: true }
        role: { $ref: "#/components/schemas/Role" }

    RoleDemoResponse:
      type: object
      required: [role, granted]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        granted: { type: boolean, example: true }

    ScopeDemoResponse:
      type: object
      required: [scope, granted]
      properties:
        scope: { $ref: "#/components/schemas/Scope" }
        granted: { type: boolean, example: true }

    ApiKeyKind:
      type: string
      enum: [valid, expired, revoked]

    ApiKeyStatus:
      type: string
      enum: [active, expired, revoked]

    ApiKeyIssueRequest:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
        kind:
          $ref: "#/components/schemas/ApiKeyKind"

    ApiKeyIssueResponse:
      type: object
      required: [apiKey, keyId, label, status, issuedAt, expiresAt]
      properties:
        apiKey:
          type: string
          description: The generated key value — returned only here, this one time.
        keyId:
          type: string
          format: uuid
          description: Non-secret identifier for correlation/labeling; not usable for lookup.
        label:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/ApiKeyStatus"
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true

    ApiKeyProtectedResponse:
      type: object
      required: [granted, keyId, label]
      properties:
        granted: { type: boolean, example: true }
        keyId: { type: string, format: uuid }
        label: { type: string, nullable: true }

    BasicAuthResponse:
      type: object
      required: [authenticated, username]
      properties:
        authenticated: { type: boolean, example: true }
        username: { type: string }

    DelayResponse:
      type: object
      required: [delayMs]
      properties:
        delayMs: { type: integer, minimum: 0 }

    PayloadSizePreset:
      type: string
      enum: [small, medium, large]

    GeneratedPayload:
      type: object
      required: [size, data]
      properties:
        size: { type: integer, minimum: 0 }
        data: { type: string }

    PayloadEchoResponse:
      type: object
      required: [received, contentLength]
      properties:
        received: { type: boolean, example: true }
        contentLength: { type: integer, minimum: 0 }

    ContentType:
      type: string
      enum: [json, text, html, xml]

    ContentAcceptedResponse:
      type: object
      required: [accepted, type]
      properties:
        accepted: { type: boolean, example: true }
        type: { $ref: "#/components/schemas/ContentType" }

    HeadersResponse:
      type: object
      required: [headers]
      properties:
        headers:
          type: object
          additionalProperties: true

    CookieMapResponse:
      type: object
      required: [cookies]
      properties:
        cookies:
          type: object
          additionalProperties: { type: string }

    CookieSetRequest:
      type: object
      required: [name, value]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        value: { type: string }

    CookieSetResponse:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: string }

    CookieClearResponse:
      type: object
      required: [cleared, name]
      properties:
        cleared: { type: boolean, example: true }
        name: { type: string }

    FileMetadata:
      type: object
      required: [id, filename, contentType, size, uploadedAt]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        contentType: { type: string }
        size: { type: integer, minimum: 0 }
        uploadedAt: { type: string, format: date-time }
  responses:
    NotFound:
      description: The requested route does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MethodNotAllowed:
      description: The HTTP method is not supported on this route
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: The request failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, malformed, expired, invalid, or revoked token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated but missing the required role
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: Request body exceeds the configured maximum payload size
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMediaType:
      description: Request's Content-Type header does not match this endpoint's expected media type
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Rate-limit threshold exceeded for this caller within the current window
      headers:
        Retry-After: { schema: { type: integer, minimum: 0 }, description: "Seconds until the caller's window resets" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The same Idempotency-Key was reused with a different request body
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    StorageLimitExceeded:
      description: The configured maximum number of stored files has been reached
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: Demonstrates 500 Internal Server Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: Demonstrates 503 Service Unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RequestTimeout:
      description: Demonstrates 408 Request Timeout (responds immediately; no connection is actually held open)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  headers:
    X-Request-ID:
      description: Unique identifier for this request, echoed on every response and in every error body.
      schema:
        type: string
        format: uuid
