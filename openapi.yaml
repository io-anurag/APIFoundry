  # ---------------------------------------------------------------------------------------------
  # Status Code Playground
  # ---------------------------------------------------------------------------------------------
  /api/v1/status/{code}:
    parameters:
      - $ref: "#/components/parameters/StatusCodeParam"
    get:
      tags: [Status Codes]
      summary: Demonstrate a specific HTTP status code
      description: >
        Returns the exact status, headers, and body shape for one of the 24 documented codes. A `code`
        value that is malformed, out of the 100-599 range, or well-formed but not one of the 24
        documented codes always returns 400 (never the demonstrated code itself).
      operationId: demonstrateStatusCode
      security: []
      responses:
        "200":
          description: Demonstrates 200 OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusDemoSuccess" }
        "201":
          description: Demonstrates 201 Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusDemoSuccess" }
        "202":
          description: Demonstrates 202 Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusDemoSuccess" }
        "204":
          description: Demonstrates 204 No Content (no response body)
        "301":
          description: Demonstrates 301 Moved Permanently
          headers:
            Location: { schema: { type: string }, description: "Points at this endpoint's own /api/v1/status/200" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusDemoRedirect" }
        "302":
          description: Demonstrates 302 Found
          headers:
            Location: { schema: { type: string }, description: "Points at this endpoint's own /api/v1/status/200" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusDemoRedirect" }
        "304":
          description: Demonstrates 304 Not Modified (no response body)
        "400":
          description: >
            Malformed `code` (VALIDATION_ERROR), `code` outside 100-599 (VALIDATION_ERROR), or `code`
            well-formed but not one of the 24 documented codes (UNSUPPORTED_STATUS_CODE). Also
            demonstrates 400 Bad Request itself when `code=400`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Demonstrates 401 Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Demonstrates 403 Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Demonstrates 404 Not Found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "405":
          description: Demonstrates 405 Method Not Allowed
          headers:
            Allow: { schema: { type: string }, description: "GET — this endpoint's own real allowed method" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "406":
          description: Demonstrates 406 Not Acceptable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "408":
          description: Demonstrates 408 Request Timeout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Demonstrates 409 Conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: Demonstrates 410 Gone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: Demonstrates 415 Unsupported Media Type
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Demonstrates 422 Unprocessable Entity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Demonstrates 429 Too Many Requests
          headers:
            Retry-After: { schema: { type: string }, description: "Fixed demonstration value (60); no real rate-limit state is tracked" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Demonstrates 500 Internal Server Error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501":
          description: Demonstrates 501 Not Implemented
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Demonstrates 502 Bad Gateway
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Demonstrates 503 Service Unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "504":
          description: Demonstrates 504 Gateway Timeout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/test:
    get:
      tags: [Error Simulation]
      summary: Generic, composable test-scenario endpoint — the primary k6 hook
      description: >
        Dispatches on `scenario`, reproducing each `/errors/*` outcome (plus `success`, `delayed`,
        and `large-response`) behind one endpoint. `status` lets a caller reach any code documented
        by `GET /api/v1/status/{code}` directly (including body-less and redirect codes) when no
        conflicting named scenario is given. `delay` (only meaningful for `scenario=delayed`) and
        `failureRate` (only meaningful for `scenario` in `server-error`, `service-unavailable`,
        `rate-limit`, `timeout`) compose optional timing/probabilistic behavior on top.
      operationId: getTestScenario
      security: []
      parameters:
        - name: scenario
          in: query
          required: false
          description: Defaults to "success" when omitted.
          schema:
            type: string
            enum:
              [
                success,
                validation-error,
                unauthorized,
                forbidden,
                not-found,
                conflict,
                rate-limit,
                server-error,
                service-unavailable,
                timeout,
                delayed,
                large-response,
              ]
        - name: status
          in: query
          required: false
          description: >
            Any status code documented by GET /api/v1/status/{code}. Rejected with 400 if it
            conflicts with a scenario that already has its own fixed status.
          schema: { type: integer, minimum: 100, maximum: 599 }
        - name: delay
          in: query
          required: false
          description: Milliseconds to wait before responding; only meaningful for scenario=delayed.
          schema: { type: integer, minimum: 0 }
        - name: failureRate
          in: query
          required: false
          description: >
            Decimal in [0, 1]; only meaningful for the four failure-representing scenarios.
            Defaults to 1 (always fail) when omitted, so a bare scenario matches its dedicated
            /errors/* counterpart exactly.
          schema: { type: number, minimum: 0, maximum: 1 }
      responses:
        "200":
          description: >
            Reached via: scenario=success or absent with status omitted or 200 (name/message
            included, matching GET /api/v1/status/200's own body); a failure-representing scenario
            that rolled a simulated success (scenario+status only, no name/message);
            scenario=delayed (scenario/status/delayMs); scenario=large-response (bare {size, data},
            no scenario/status wrapper — its exact byte size must match Spec 007's "large" preset,
            FR-010); or scenario=success with a status override resolving to a 2xx code documented
            by GET /api/v1/status/{code} other than 200/204 (name/message included, matching that
            endpoint's own body for the code)
          headers:
            X-Request-ID: { $ref: "#/components/headers/X-Request-ID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestScenarioResult" }
        "204":
          description: status=204 accepted as a success-scenario override (no response body)
        "301":
          description: status=301 accepted as a success-scenario override
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusDemoRedirect" }
        "302":
          description: status=302 accepted as a success-scenario override
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusDemoRedirect" }
        "304":
          description: status=304 accepted as a success-scenario override (no response body)
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "408": { $ref: "#/components/responses/RequestTimeout" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

