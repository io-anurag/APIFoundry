# APIFoundry's single project-wide OpenAPI document (constitution: always kept in sync with the
# implementation). Seeded by Spec 001 (Foundation, Config & Health) with the meta endpoints and the
# shared Error/Pagination schemas; every later spec appends its own paths/schemas here rather than
# creating a second document.

openapi: 3.0.3
info:
  title: APIFoundry
  version: "0.1.0"
  description: >
    General-purpose mock API server used as a testing target for functional, negative, automation,
    contract, and performance/load testing. This foundation slice provides configuration, health,
    version/info, and the shared error/pagination envelopes every other endpoint reuses.

servers:
  - url: /

tags:
  - name: Meta
    description: >
      Health, liveness/readiness, version, instance info, the OpenAPI document itself, and route
      discovery — outside the versioned API prefix (except /api/v1/info and /api/v1/routes).
  - name: Core Resources
    description: Full CRUD for the four primary resources — users, products, orders, customers.
  - name: Catalog
    description: Read-only catalog resources — categories, posts, comments, reviews, payments.
  - name: Nested Resources
    description: Parent-child navigation across users, posts, products, and orders.
  - name: Search
    description: Cross-resource free-text search.
  - name: Status Codes
    description: Deterministic, self-contained demonstrations of every documented HTTP status code.
  - name: Auth
    description: JWT session lifecycle (login/logout/refresh/me) and test-convenience token issuance/inspection.
  - name: Access Control Demos
    description: Dedicated endpoints demonstrating 401-vs-403, role enforcement, and scope enforcement.
  - name: API Key & Basic Auth
    description: >
      Independent, secondary auth mechanisms alongside JWT (Spec 005) — issue/revoke/verify
      opaque API keys, and a single-account HTTP Basic Auth demo.
  - name: HTTP Testing Utilities
    description: >
      Low-level HTTP-mechanics endpoints for timeout, payload-size, content-type, header, and
      cookie testing — delay, bounded payload generation/echo, content-type demonstration and
      validation, safe header echo, and multi-cookie management.
  - name: Resilience Simulation
    description: >
      Endpoints that simulate unreliable backends in a reproducible way — rate limiting, flaky
      failures, idempotent writes, and conditional-request caching.
  - name: Files
    description: >
      Bounded, in-memory file upload, download, list, and delete — isolated from every other
      feature area.
  - name: Error Simulation
    description: >
      Deterministic, dedicated demonstrations of nine standard failure modes, plus one configurable
      endpoint (the primary k6 hook) that composes the same outcomes — and optional delay,
      oversized-payload, and probabilistic-failure behavior — behind a single `scenario` query
      parameter.
  - name: Admin
    description: >
      Admin-token-gated operational endpoints that restore the mock server's mutable state back to
      its deterministic seed configuration, without a process restart — split into a data-plane
      reset and an auth-plane reset so a caller can restore one domain independently of the other.

paths:
  /health:
    get:
      tags: [Meta]
      summary: Combined health status
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /health/live:
    get:
      tags: [Meta]
      summary: Liveness probe
      operationId: getHealthLive
      security: []
