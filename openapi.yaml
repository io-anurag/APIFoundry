      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/posts/{id}/comments:
    parameters:
      - $ref: "#/components/parameters/PostIdParam"
    get:
      tags: [Nested Resources]
      summary: List comments on a post
      operationId: listCommentsForPost
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Paginated list of the post's comments (possibly empty)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pagination"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Nested Resources]
      summary: Create a comment on a post
      operationId: createCommentForPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentCreate"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/products/{id}/reviews:
    parameters:
      - $ref: "#/components/parameters/ProductIdParam"
    get:
      tags: [Nested Resources]
      summary: List reviews for a product
      operationId: listReviewsForProduct
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Paginated list of the product's reviews (possibly empty)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pagination"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Review"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/products/{id}/category:
    parameters:
      - $ref: "#/components/parameters/ProductIdParam"
    get:
      tags: [Nested Resources]
      summary: Get the category record for a product
      operationId: getCategoryForProduct
      responses:
        "200":
          description: The product's category record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orders/{id}/products:
    parameters:
      - $ref: "#/components/parameters/OrderIdParam"
    get:
      tags: [Nested Resources]
      summary: List the distinct products referenced by an order's line items
      operationId: listProductsForOrder
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Paginated list of the order's distinct products
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pagination"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"

  # ---------------------------------------------------------------------------------------------
  # Search
  # ---------------------------------------------------------------------------------------------
  /api/v1/search:
    get:
      tags: [Search]
      summary: Cross-resource free-text search
      operationId: search
      parameters:
        - name: q
          in: query
          required: true
          description: Free-text search term. Required and non-empty.
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Paginated, combined set of matches across resources (possibly empty)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pagination"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/SearchResult"
        "400":
          $ref: "#/components/responses/ValidationError"

  # ---------------------------------------------------------------------------------------------
  # Status Code Playground
  # ---------------------------------------------------------------------------------------------
  /api/v1/status/{code}:
    parameters:
      - $ref: "#/components/parameters/StatusCodeParam"
    get:
      tags: [Status Codes]
      summary: Demonstrate a specific HTTP status code
      description: >
        Returns the exact status, headers, and body shape for one of the 24 documented codes. A `code`
        value that is malformed, out of the 100-599 range, or well-formed but not one of the 24
        documented codes always returns 400 (never the demonstrated code itself).
      operationId: demonstrateStatusCode
      responses:
        "200":
          description: Demonstrates 200 OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusDemoSuccess" }
        "201":
          description: Demonstrates 201 Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusDemoSuccess" }
        "202":
          description: Demonstrates 202 Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusDemoSuccess" }
        "204":
          description: Demonstrates 204 No Content (no response body)
        "301":
          description: Demonstrates 301 Moved Permanently
          headers:
            Location: { schema: { type: string }, description: "Points at this endpoint's own /api/v1/status/200" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusDemoRedirect" }
        "302":
          description: Demonstrates 302 Found
          headers:
            Location: { schema: { type: string }, description: "Points at this endpoint's own /api/v1/status/200" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusDemoRedirect" }
        "304":
          description: Demonstrates 304 Not Modified (no response body)
        "400":
          description: >
            Malformed `code` (VALIDATION_ERROR), `code` outside 100-599 (VALIDATION_ERROR), or `code`
            well-formed but not one of the 24 documented codes (UNSUPPORTED_STATUS_CODE). Also
            demonstrates 400 Bad Request itself when `code=400`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Demonstrates 401 Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Demonstrates 403 Forbidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Demonstrates 404 Not Found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "405":
          description: Demonstrates 405 Method Not Allowed
          headers:
            Allow: { schema: { type: string }, description: "GET — this endpoint's own real allowed method" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "406":
          description: Demonstrates 406 Not Acceptable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "408":
          description: Demonstrates 408 Request Timeout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Demonstrates 409 Conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: Demonstrates 410 Gone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: Demonstrates 415 Unsupported Media Type
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Demonstrates 422 Unprocessable Entity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Demonstrates 429 Too Many Requests
          headers:
            Retry-After: { schema: { type: string }, description: "Fixed demonstration value (60); no real rate-limit state is tracked" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Demonstrates 500 Internal Server Error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501":
          description: Demonstrates 501 Not Implemented
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: Demonstrates 502 Bad Gateway
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Demonstrates 503 Service Unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "504":
          description: Demonstrates 504 Gateway Timeout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  parameters:
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SortParam:
      name: sort
      in: query
      required: false
      description: Field name for ascending order, or `-field` for descending.
      schema:
        type: string
    UserIdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
    ProductIdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
    CustomerIdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
    OrderIdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer

    CategorySlugParam:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    PostIdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommentIdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
    ReviewIdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
    PaymentIdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DateParam:
      name: date
      in: path
      required: true
      schema:
        type: string
        format: date
    RatingParam:
      name: rating
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 5
    StatusCodeParam:
      name: code
      in: path
      required: true
      description: >
        Must be a strict positive integer with no leading zero and no surrounding whitespace, in the
        range 100-599, and one of the 24 documented codes — anything else returns 400.
      schema:
        type: integer
        minimum: 100
        maximum: 599

  schemas:
    UserRole:
      type: string
      enum: [user, admin, manager, readonly]

    UserStatus:
      type: string
      enum: [active, inactive]

    ProductCategory:
      type: string
      enum: [electronics, books, clothing, home, toys, grocery, sports, beauty, automotive, other]

    OrderStatus:
      type: string
      enum: [pending, processing, shipped, delivered, cancelled]

    User:
      type: object
      required: [id, name, email, role, status, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/UserRole" }
        status: { $ref: "#/components/schemas/UserStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UserCreate:
      type: object
      required: [name, email, role]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/UserRole" }
        status: { $ref: "#/components/schemas/UserStatus" }

    UserPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/UserRole" }
        status: { $ref: "#/components/schemas/UserStatus" }

    Product:
      type: object
      required: [id, name, description, price, category, stock, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        price: { type: number, exclusiveMinimum: 0 }
        category: { $ref: "#/components/schemas/ProductCategory" }
        stock: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProductCreate:
      type: object
      required: [name, price, category, stock]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        price: { type: number, exclusiveMinimum: 0 }
        category: { $ref: "#/components/schemas/ProductCategory" }
        stock: { type: integer, minimum: 0 }

    ProductPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        price: { type: number, exclusiveMinimum: 0 }
        category: { $ref: "#/components/schemas/ProductCategory" }
        stock: { type: integer, minimum: 0 }

    Address:
      type: object
      required: [street, city, postalCode, country]
      additionalProperties: false
      properties:
        street: { type: string }
        city: { type: string }
        postalCode: { type: string }
        country: { type: string }

    Customer:
      type: object
      required: [id, name, email, address, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        address: { $ref: "#/components/schemas/Address" }
        userId: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CustomerCreate:
      type: object
      required: [name, email, address]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email }
        address: { $ref: "#/components/schemas/Address" }
        userId: { type: integer, nullable: true }

    CustomerPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email }
        address: { $ref: "#/components/schemas/Address" }
        userId: { type: integer, nullable: true }

    OrderLineItem:
      type: object
      required: [productId, quantity]
      additionalProperties: false
      properties:
        productId: { type: integer }
        quantity: { type: integer, minimum: 1 }

    Order:
      type: object
      required: [id, customerId, items, status, total, createdAt, updatedAt]
      properties:
        id: { type: integer }
        customerId: { type: integer }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/OrderLineItem" }
        status: { $ref: "#/components/schemas/OrderStatus" }
        total: { type: number, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    OrderCreate:
      type: object
      required: [customerId, items]
      additionalProperties: false
      properties:
        customerId: { type: integer }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/OrderLineItem" }
        status: { $ref: "#/components/schemas/OrderStatus" }

    OrderPatch:
      type: object
      additionalProperties: false
      properties:
        customerId: { type: integer }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/OrderLineItem" }
        status: { $ref: "#/components/schemas/OrderStatus" }

    HealthStatus:
      type: object
      required: [status, uptimeSeconds, timestamp]
      properties:
        status:
          type: string
          enum: [ok, not-ready]
        uptimeSeconds:
          type: number
        timestamp:
          type: string
          format: date-time

    VersionInfo:
      type: object
      required: [version, nodeEnv]
      properties:
        version:
          type: string
        nodeEnv:
          type: string

    ApiInfo:
      type: object
      required: [name, version, environment, apiPrefix, uptimeSeconds]
      properties:
        name:
          type: string
        version:
          type: string
        environment:
          type: string
        apiPrefix:
          type: string
        uptimeSeconds:
          type: number

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, requestId]
          properties:
            code:
              type: string
              example: RESOURCE_NOT_FOUND
            message:
              type: string
            details:
              type: object
            requestId:
              type: string
              format: uuid

    Pagination:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: {}
        pagination:
          type: object
          required: [page, limit, total, totalPages, hasNext, hasPrevious]
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer
            hasNext:
              type: boolean
            hasPrevious:
              type: boolean

    PaymentStatus:
      type: string
      enum: [pending, completed, failed, refunded]

    SearchResourceType:
      type: string
      enum: [user, customer, product, category, post, comment, review]

    Category:
      type: object
      required: [id, name, description, createdAt]
      properties:
        id: { type: string, description: URL-safe slug identifier }
        name: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }

    Post:
      type: object
      required: [id, userId, title, body, publishedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: integer }
        title: { type: string }
        body: { type: string }
        publishedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PostCreate:
      type: object
      required: [title, body]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 5000 }

    Comment:
      type: object
      required: [id, postId, userId, body, createdAt]
      properties:
        id: { type: integer }
        postId: { type: string, format: uuid }
        userId: { type: integer }
        body: { type: string }
        createdAt: { type: string, format: date-time }

    CommentCreate:
      type: object
      required: [userId, body]
      additionalProperties: false
      properties:
        userId: { type: integer }
        body: { type: string, minLength: 1, maxLength: 1000 }

    Review:
      type: object
      required: [id, productId, userId, rating, body, createdAt]
      properties:
        id: { type: integer }
        productId: { type: integer }
        userId: { type: integer }
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string }
        createdAt: { type: string, format: date-time }

    Payment:
      type: object
      required: [id, orderId, amount, status, processedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: integer }
        amount: { type: number, minimum: 0 }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        processedAt: { type: string, format: date }
        createdAt: { type: string, format: date-time }

    SearchResult:
      type: object
      required: [resourceType, id, label]
      properties:
        resourceType: { $ref: "#/components/schemas/SearchResourceType" }
        id:
          oneOf:
            - type: string
            - type: integer
        label: { type: string }
        snippet: { type: string }

    StatusDemoSuccess:
      type: object
      required: [status, name, message]
      properties:
        status: { type: integer, example: 200 }
        name: { type: string, example: "OK" }
        message: { type: string }

    StatusDemoRedirect:
      type: object
      required: [status, name, message, location]
      properties:
        status: { type: integer, example: 301 }
        name: { type: string, example: "Moved Permanently" }
        message: { type: string }
        location: { type: string, example: "/api/v1/status/200" }
  responses:
    NotFound:
      description: The requested route does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MethodNotAllowed:
      description: The HTTP method is not supported on this route
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: The request failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  headers:
    X-Request-ID:
      description: Unique identifier for this request, echoed on every response and in every error body.
      schema:
        type: string
        format: uuid
